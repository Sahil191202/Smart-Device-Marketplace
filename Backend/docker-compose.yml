version: '3.8'

services:
  # ── Node.js API ─────────────────────────────────────────────────────────────
  api:
    build:
      context: .
      target: production
    container_name: smart_api
    env_file: /.env
    ports:
      - "5000:5000"
    depends_on:
      mongo1:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - marketplace_net
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 512M
          cpus: '0.5'
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:5000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  # ── MongoDB Replica Set (3 nodes for real replication) ──────────────────────
  # Even in dev, replica set is required for:
  # - Change streams (real-time notifications)
  # - Transactions (order processing)
  # - Retryable writes
  mongo1:
    image: mongo:7.0
    container_name: smart_mongo1
    command: mongod --replSet rs0 --bind_ip_all --port 27017
    ports:
      - "27017:27017"
    volumes:
      - mongo1_data:/data/db
      - ./scripts/mongo-init.js:/docker-entrypoint-initdb.d/mongo-init.js:ro
    networks:
      - marketplace_net
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

  mongo2:
    image: mongo:7.0
    container_name: smart_mongo2
    command: mongod --replSet rs0 --bind_ip_all --port 27017
    volumes:
      - mongo2_data:/data/db
    networks:
      - marketplace_net
    restart: unless-stopped

  mongo3:
    image: mongo:7.0
    container_name: smart_mongo3
    command: mongod --replSet rs0 --bind_ip_all --port 27017
    volumes:
      - mongo3_data:/data/db
    networks:
      - marketplace_net
    restart: unless-stopped

  # ── Mongo replica set initializer ───────────────────────────────────────────
  mongo-init:
    image: mongo:7.0
    container_name: smart_mongo_init
    depends_on:
      mongo1:
        condition: service_healthy
    networks:
      - marketplace_net
    command: >
      mongosh --host mongo1:27017 --eval "
        rs.initiate({
          _id: 'rs0',
          members: [
            { _id: 0, host: 'mongo1:27017', priority: 2 },
            { _id: 1, host: 'mongo2:27017', priority: 1 },
            { _id: 2, host: 'mongo3:27017', priority: 1 }
          ]
        })
      "
    restart: on-failure

  # ── Redis ─────────────────────────────────────────────────────────────────
  redis:
    image: redis:7.2-alpine
    container_name: smart_redis
    command: redis-server --appendonly yes --maxmemory 256mb --maxmemory-policy allkeys-lru
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    networks:
      - marketplace_net
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5
    deploy:
      resources:
        limits:
          memory: 300M

  # ── Redis Commander (dev UI) ──────────────────────────────────────────────
  redis-commander:
    image: rediscommander/redis-commander:latest
    container_name: smart_redis_ui
    environment:
      - REDIS_HOSTS=local:redis:6379
    ports:
      - "8081:8081"
    depends_on:
      - redis
    networks:
      - marketplace_net
    profiles:
      - dev  # only starts with: docker-compose --profile dev up

      # ── AI Price Prediction Service ──────────────────────────────────────────────
  ai-service:
    build:
      context: ./ai-service
    container_name: smart_ai
    environment:
      - AI_INTERNAL_KEY=${AI_INTERNAL_KEY}
      - ALLOWED_ORIGINS=http://api:5000
    ports:
      - "8000:8000"   # expose for dev/testing — remove in production
    networks:
      - marketplace_net
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 512M
          cpus: '1.0'   # ML inference is CPU-bound
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s   # extra time for model training on first boot


networks:
  marketplace_net:
    driver: bridge

volumes:
  mongo1_data:
  mongo2_data:
  mongo3_data:
  redis_data:


  